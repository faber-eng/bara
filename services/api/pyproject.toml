[project]
name = "bara-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "google-genai==2.31.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "google-cloud-firestore==2.34.1",
    "google-cloud-bigquery==3.46.2",
    "google-cloud-storage==3.17.1",
    "google-cloud-pubsub==2.43.0",
    "google-cloud-tasks==2.26.0",
    "firebase-admin==7.7.0",
    "earthengine-api==1.7.48",
    "google-cloud-secret-manager==2.31.0",
    "google-adk==2.12.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../pipelines"]
markers = ["live: talks to real Google Cloud; runs only when BARA_LIVE=1"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["ee_lib"]
