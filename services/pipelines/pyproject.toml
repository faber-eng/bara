[project]
name = "bara-pipelines"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "earthengine-api==1.7.48",
    "google-cloud-bigquery==3.46.2",
    "google-cloud-firestore==2.34.1",
    "google-cloud-pubsub==2.43.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
